name: Verify quines

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Seven languages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install compilers and interpreters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ python3 lua5.3 ruby perl php-cli
      - name: Test verification guards
        run: python3 -m unittest discover -s tests -v
      - name: Verify all quines
        env:
          LUA: lua5.3
        run: python3 scripts/verify.py
